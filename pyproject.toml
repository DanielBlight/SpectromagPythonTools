[project]
name = "spectromagpythontools"
version = "0.1.0"
description = "Instrument control and photocurrent mapping for the Spectromag laboratory"
readme = "README.md"
authors = [
    { name = "Daniel Blight", email = "daniel.blight@manchester.ac.uk" }
]
requires-python = ">=3.12"
dependencies = ["pyvisa>=1.14,<2",
    "matplotlib>=3.8,<4",
]

[project.scripts]
spectromagpythontools = "spectromagpythontools:main"
spectromag-gui = "spectromagpythontools.cli.commissioning_gui:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
